services:
  db:
    image: mysql:5.7
    container_name: ${TENANT_NAME}_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: prestashop
      MYSQL_USER: psuser
      MYSQL_PASSWORD: pspassword
    networks:
      - ps-net
    volumes:
      - ${TENANT_NAME}_db_data:/var/lib/mysql

  prestashop:
    image: prestashop/prestashop:8-apache
    container_name: ${TENANT_NAME}_shop
    restart: always
    depends_on:
      - db
    networks:
      - ps-net
    ports:
      - "${TENANT_PORT}:80"
    environment:
      DB_SERVER: db
      DB_USER: psuser
      DB_PASSWD: pspassword
      PS_INSTALL_AUTO: "1"
      PS_DEV_MODE: "0"
      PS_HOST_MODE: "1"
      PS_ENABLE_SSL: "0"
      PS_HANDLE_DYNAMIC_DOMAIN: "0"
      PS_DOMAIN: localhost:${TENANT_PORT}
      PS_LANGUAGE: en
      PS_COUNTRY: US
      PS_FOLDER_ADMIN: admin
      PS_FOLDER_INSTALL: install
      ADMIN_MAIL: ${ADMIN_MAIL}
      ADMIN_PASSWD: ${ADMIN_PASSWD}
    volumes:
      - ${TENANT_NAME}_ps_data:/var/www/html

volumes:
  ${TENANT_NAME}_db_data:
  ${TENANT_NAME}_ps_data:

networks:
  ps-net:
    driver: bridge
