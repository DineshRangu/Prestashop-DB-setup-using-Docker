<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrestaShop SaaS</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #f0f4ff, #e6f9f0);
      color: #222;
      padding: 3rem;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: #fff;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
      max-width: 420px;
      width: 100%;
      text-align: center;
      transition: transform 0.3s ease;
    }

    .container:hover {
      transform: translateY(-5px);
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 2rem;
      color: #2c3e50;
    }

    label {
      display: block;
      text-align: left;
      font-size: 0.95rem;
      font-weight: 600;
      margin: 1rem 0 0.3rem;
      color: #444;
    }

    input {
      padding: 0.7rem;
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      transition: border 0.3s, box-shadow 0.3s;
    }

    input:focus {
      border-color: #6c63ff;
      outline: none;
      box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.2);
    }

    button {
      margin-top: 1.5rem;
      background: linear-gradient(135deg, #6c63ff, #48c6ef);
      color: #fff;
      padding: 0.9rem 1.8rem;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      width: 100%;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
      box-shadow: none;
    }

    #output {
      margin-top: 2rem;
      font-size: 0.95rem;
      text-align: left;
      background: #f7f9fc;
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid #e5e9f0;
    }

    #output a {
      color: #6c63ff;
      font-weight: 600;
      text-decoration: none;
    }

    #output a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 PrestaShop SaaS</h1>
    <label for="email">Admin Email:</label>
    <input type="email" id="email" placeholder="admin@example.com">

    <label for="password">Admin Password:</label>
    <input type="text" id="password" placeholder="YourPassword123">

    <button id="create-btn">Create New Store</button>
    <p id="output"></p>
  </div>

  <script>
    document.getElementById('create-btn').addEventListener('click', async () => {
      const btn = document.getElementById('create-btn');
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      btn.disabled = true;
      btn.textContent = 'Creating...';

      try {
        const res = await fetch('/create-store', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        document.getElementById('output').innerHTML =
          `✅ Store ready: <a href="${data.url}" target="_blank">${data.url}</a><br />` +
          `🔑 Admin URL: <a href="${data.admin_url}" target="_blank">${data.admin_url}</a><br />` +
          `📧 Email: ${data.admin_email}<br />` +
          `🔒 Password: ${data.admin_password}`;
      } catch (err) {
        document.getElementById('output').textContent = '❌ Error creating store';
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create New Store';
      }
    });
  </script>
</body>
</html>
